[package]
name = "ultra-dict"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ultra_dict_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MDict reader. Pinned exactly; used only inside src/format/mdict.rs (docs/spec-v1.md).
mdictlib = { version = "=0.2.8", features = ["lzo"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
unicode-normalization = "0.1.26"
tauri-plugin-dialog = "2"
# Decodes `dict://` resource URLs (src/protocol.rs).
percent-encoding = "2"
# Canonical paths without the `\\?\` prefix on Windows (src/library/mod.rs).
dunce = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
# Mock runtime for the IPC tests in tests/commands.rs.
tauri = { version = "2", features = ["test"] }
